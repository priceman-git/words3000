# nginx для 5555words.com — статическое приложение «3000 слов» (PWA), файлы в /var/www/5555words
# HTTPS добавляет certbot (--nginx): он сам допишет listen 443, сертификаты и редирект с http.

server {
    listen 80;
    listen [::]:80;
    server_name 5555words.com www.5555words.com server.5555words.com;

    root /var/www/5555words;
    index index.html;
    charset utf-8;

    # перенаправление www → 5555words.com добавляется после выпуска сертификата
    # (раньше нельзя: сломает проверку Let's Encrypt для www)

    # сжатие: словарь words.js 1 МБ → ~0,4 МБ
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # тип для манифеста — точечно (блок types{} в server заменил бы весь стандартный список типов)
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }

    # служебные файлы проекта наружу не отдаём
    location ~ ^/(data|deploy|\.git)/ { return 404; }
    location ~ \.(py|md|sh)$ { return 404; }

    # sw.js и index.html всегда проверяются заново — иначе обновления приходят с опозданием
    location = /sw.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /           { add_header Cache-Control "no-cache"; try_files /index.html =404; }

    # версионированные файлы (?v=N), шрифты и иконки — надолго
    location ~* \.(js|css|woff2|png|svg)$ { add_header Cache-Control "public, max-age=31536000"; try_files $uri =404; }

    location / { try_files $uri /index.html; }
}
